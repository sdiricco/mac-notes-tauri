[package]
name = "rustnotes"
version = "0.10.0"
description = "RustNotes: a simple, local-first notes app. Vue frontend, Rust backend (Tauri v2)."
authors = ["Simone Di Ricco"]
edition = "2021"
license = "MIT"
repository = "https://github.com/sdiricco/mac-notes-tauri"

[lib]
name = "rustnotes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "devtools": abilita "Ispeziona elemento" col tasto destro anche nelle build
# release, non solo in dev. Utile finche' l'app non ha un pubblico esterno da
# proteggere da un'ispezione troppo facile del proprio frontend.
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["time"] }
sys-locale = "0.3"

[dev-dependencies]
tempfile = "3"
